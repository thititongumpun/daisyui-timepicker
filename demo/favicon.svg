<!-- Hands read 9:30, the same value the hero picker ships with.
     Hex is hard-coded because a favicon renders outside the document, where
     daisyUI's CSS custom properties do not exist. #422ad5 is the daisyUI
     light-theme primary, converted from its OKLCH source. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="daisyui-timepicker">
  <rect width="32" height="32" rx="7" fill="#422ad5"/>
  <circle cx="16" cy="16" r="10.6" fill="none" stroke="#ffffff" stroke-width="1.7" opacity="0.45"/>
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path d="M16 16 V23.6"/>
    <path d="M16 16 L10.6 14.6"/>
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#ffffff"/>
</svg>
